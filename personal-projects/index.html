<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal projects — eshan.in</title>
<meta name="description" content="Apps and side projects by Eshan Zain.">
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #5c5c5c;
    --rule: #e3e3e3; --accent: #1f6f43; --card: #f7f7f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e8e8e6; --muted: #9aa0a6;
      --rule: #2b2f36; --accent: #6cc38f; --card: #1b1e24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 40rem; margin: 0 auto; padding: 5rem 1.25rem; }
  .back { display: inline-block; margin-bottom: 1.5rem; font-size: .95rem; }
  h1 {
    font: 600 1.6rem/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 0 0 2.5rem; letter-spacing: -.02em;
  }
  h2 { font-size: 1.05rem; margin: 0 0 1rem; color: var(--muted); font-weight: 600; }
  a { color: var(--accent); text-underline-offset: 2px; }
  .card {
    display: block; background: var(--card); border: 1px solid var(--rule);
    border-radius: 10px; padding: 1rem 1.25rem; text-decoration: none; color: inherit;
  }
  .card strong { display: block; font-size: 1.05rem; }
  .card span { color: var(--muted); font-size: .95rem; }
  .card ul { margin: .75rem 0 0; padding-left: 1.25rem; font-size: .95rem; }
  footer { margin-top: 4rem; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← eshan.in</a>
  <h1>/personal-projects</h1>

  <h2>Apps</h2>
  <div class="card">
    <strong>CalorieTracker</strong>
    <span>An iOS calorie tracker with photo logging and a strength &amp;
    conditioning program.</span>
    <ul>
      <li><a href="/calorietracker/support/">Support</a></li>
      <li><a href="/calorietracker/privacy/">Privacy policy</a></li>
    </ul>
  </div>

  <footer>
    <a href="mailto:daregroup9@gmail.com">daregroup9@gmail.com</a>
  </footer>
</div>
</body>
</html>
